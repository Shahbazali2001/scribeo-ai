name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  mobile-typecheck:
    name: Mobile App (Expo TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx tsc --noEmit

  ocr-service-tests:
    name: OCR Model Service (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install fastapi httpx pytest pydantic pydantic-settings Pillow python-multipart
          python -m pytest -v

  backend-tests:
    name: Backend API (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: dev-service-key
      SUPABASE_JWT_SECRET: dev-jwt-secret
      OCR_SERVICE_KEY: dev-ocr-secret-key
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          python -m pytest -v
